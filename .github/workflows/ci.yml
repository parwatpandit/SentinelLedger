name: SentinelLedger CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: parwat123
          POSTGRES_DB: sentinelledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_USER: postgres
          DB_PASSWORD: parwat123
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sentinelledger
          SECRET_KEY: testsecretkey123
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          EMAIL_ADDRESS: test@test.com
          EMAIL_PASSWORD: testpassword
        run: |
          pytest tests/ -v